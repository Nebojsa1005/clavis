<section class="tracks" aria-label="Instrumenti">
  <h2>Instrumenti</h2>
  <ul class="parts">
    @for (part of scoreModel.document().parts; track part.id; let partIndex = $index; let first = $first; let last = $last) {
      <li class="part">
        <div class="part__header">
          @if (editingPartId() === part.id) {
            <input
              #renameInput
              class="part__rename"
              type="text"
              maxlength="40"
              aria-label="Naziv instrumenta"
              [value]="part.name"
              (keydown.enter)="commitRename(part, renameInput.value)"
              (keydown.escape)="cancelRename()"
              (blur)="commitRename(part, renameInput.value)"
            />
          } @else {
            <span class="part__name" hlmTooltip="Dvoklik za promenu naziva" position="left" (dblclick)="startRename(part)">{{ part.name }}</span>
            <span class="part__actions">
              <button type="button" class="icon-btn" hlmTooltip="Preimenuj" position="left" aria-label="Preimenuj" (click)="startRename(part)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3z" /></svg></button>
              <button type="button" class="icon-btn" hlmTooltip="Pomeri gore" position="left" aria-label="Pomeri gore" [disabled]="first" (click)="onMove(part, -1)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" /></svg></button>
              <button type="button" class="icon-btn" hlmTooltip="Pomeri dole" position="left" aria-label="Pomeri dole" [disabled]="last" (click)="onMove(part, 1)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg></button>
              <button
                type="button"
                class="icon-btn"
                hlmTooltip="Ukloni instrument" position="left"
                aria-label="Ukloni instrument"
                [disabled]="scoreModel.document().parts.length < 2"
                (click)="onRemove(part)"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
              </button>
            </span>
          }
        </div>
        <ul class="staves">
          @for (staff of part.staves; track staff.id; let index = $index) {
            <li>
              <button
                type="button"
                class="staff-btn"
                [class.active]="staff.id === scoreModel.activeStaffId()"
                [attr.aria-pressed]="staff.id === scoreModel.activeStaffId()"
                (click)="scoreModel.setActiveStaff(staff.id)"
              >
                {{ staffLabel(part, index) }}
              </button>
            </li>
          }
        </ul>
      </li>
    }
  </ul>

  <div class="add">
    <select #presetSelect class="add__select" aria-label="Instrument za dodavanje">
      @for (preset of presets; track preset.id) {
        <option [value]="preset.id">{{ preset.name }}</option>
      }
    </select>
    <button type="button" class="add-btn" (click)="onAdd(presetSelect.value)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" /></svg>
      Dodaj
    </button>
  </div>
</section>
