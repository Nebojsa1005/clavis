<div class="shell">
  <header class="toolbar">
    <div class="toolbar__brand">
      <h1>{{ appName() }}</h1>
    </div>

    <div class="toolbar__group" aria-label="Fajl">
      <button type="button" (click)="onNew()" title="Nova, prazna partitura">Novo</button>
      <button type="button" (click)="onSave()" title="Sačuvaj lokalno (IndexedDB)">Sačuvaj</button>
      <button type="button" (click)="onExportJson()" title="Export JSON">JSON</button>
      <input
        type="file"
        accept="application/json"
        class="visually-hidden"
        #jsonFileInput
        (change)="onImportJsonFile($event)"
      />
      <button type="button" (click)="jsonFileInput.click()" title="Import JSON">Import</button>
    </div>

    <div class="toolbar__group" aria-label="Export">
      <button type="button" (click)="onExportMusicXml()" title="Export MusicXML">XML</button>
      <button type="button" (click)="onExportMidi()" title="Export MIDI">MIDI</button>
      <button type="button" (click)="onExportPng()" title="Export PNG">PNG</button>
      <button type="button" (click)="onExportSvg()" title="Export SVG">SVG</button>
    </div>

    <div class="toolbar__group" aria-label="Unos nota">
      <button
        type="button"
        class="toggle-btn"
        [class.active]="noteInput.active()"
        [attr.aria-pressed]="noteInput.active()"
        (click)="onToggleNoteInput()"
      >
        Mod unosa (N)
      </button>
    </div>

    <div class="toolbar__group" aria-label="Partitura">
      <select class="toolbar__select" aria-label="Ključ" title="Ključ" (change)="onClefChange($event)">
        @for (option of clefOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === scoreModel.score().clef">
            {{ option.label }}
          </option>
        }
      </select>
      <app-time-signature-control />
      <app-key-signature-control />
    </div>

    <div class="toolbar__group" aria-label="Izmene">
      <button type="button" [disabled]="!scoreModel.canUndo()" (click)="onUndo()" title="Undo (Ctrl+Z)">Undo</button>
      <button type="button" [disabled]="!scoreModel.canRedo()" (click)="onRedo()" title="Redo (Ctrl+Shift+Z)">
        Redo
      </button>
    </div>

    <div class="toolbar__group toolbar__group--playback" aria-label="Plejbek">
      <button type="button" (click)="onTogglePlayback()" [attr.aria-pressed]="playback.isPlaying()">
        {{ playback.isPlaying() ? '■' : '▶' }}
      </button>
      <input
        type="number"
        class="bpm-input"
        min="20"
        max="300"
        [value]="playback.bpm()"
        (change)="onBpmChange($event)"
        title="Tempo (BPM)"
      />
      <span class="toolbar__tempo">BPM</span>
      <button
        type="button"
        class="toggle-btn"
        [class.active]="playback.metronomeEnabled()"
        [attr.aria-pressed]="playback.metronomeEnabled()"
        (click)="playback.toggleMetronome()"
        title="Metronom"
      >
        Metronom
      </button>
    </div>
  </header>

  <main class="workspace">
    <div class="duration-palette" aria-label="Trajanja nota">
      @for (option of durationOptions; track option.value) {
        <button
          type="button"
          class="duration-btn"
          [class.active]="noteInput.currentDuration() === option.value"
          [attr.title]="option.label + ' (' + option.key + ')'"
          (click)="onSelectDuration(option.value)"
        >
          {{ option.key }}
        </button>
      }
      <button
        type="button"
        class="duration-btn"
        [class.active]="noteInput.dotted()"
        [attr.aria-pressed]="noteInput.dotted()"
        title="Tačka (.)"
        (click)="onToggleDotted()"
      >
        •
      </button>
    </div>

    <div class="staff-area">
      <app-staff-view />
    </div>
  </main>
</div>
