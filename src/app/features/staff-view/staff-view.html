<div class="staff-wrap" [style.zoom]="viewZoom.zoom()">
  <div
    class="staff-canvas"
    [class.input-active]="noteInput.active()"
    #canvasHost
    (click)="onCanvasClick($event)"
    (mousedown)="onCanvasMouseDown($event)"
    (mousemove)="onCanvasMouseMove($event)"
    (mouseleave)="onCanvasMouseLeave()"
  ></div>
  @if (ghostNote(); as preview) {
    <svg class="note-ghost" [style.left.px]="preview.x" [style.top.px]="preview.y" aria-hidden="true">
      @for (ledger of preview.ledgers; track $index) {
        <line [attr.x1]="ledger.x1" [attr.x2]="ledger.x2" [attr.y1]="ledger.y" [attr.y2]="ledger.y" [attr.stroke-width]="preview.ledgerWidth" />
      }
      <path [attr.d]="preview.path" [attr.transform]="preview.transform" />
      @if (preview.dot; as dot) {
        <path [attr.d]="dot.path" [attr.transform]="dot.transform" />
      }
    </svg>
    <span class="note-ghost__label" [style.left.px]="preview.x + preview.labelX" [style.top.px]="preview.y + preview.labelY">{{ preview.label }}</span>
  }
  @for (field of textFields(); track field.staffId) {
    <textarea
      class="staff-text"
      wrap="off"
      spellcheck="false"
      aria-label="Tekst ispod linijskog sistema"
      placeholder="Tekst…"
      [style.top.px]="field.top"
      [style.left.px]="field.left"
      [style.width.px]="field.width"
      [style.height.px]="textFieldHeight"
      [value]="field.text"
      (input)="onTextInput(field.staffId, $event)"
    ></textarea>
  }
  @if (selectionBox(); as box) {
    <div class="selection-box" [style.left.px]="box.left" [style.width.px]="box.width"></div>
  }
</div>
